    <path d="M-60 1560 L300 1560 L380 1740 L1140 1740" stroke-width="2" opacity="0.7"/>
  </g>

  <g fill="url(#neon)">
    <circle cx="260" cy="260" r="6" opacity="0.9"/>
    <circle cx="700" cy="460" r="6" opacity="0.9"/>
    <circle cx="1140" cy="640" r="6" opacity="0.7"/>
