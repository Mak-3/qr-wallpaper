<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#01040a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8af8ff"/>
      <stop offset="100%" stop-color="#1fb6ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <g stroke="#2f6fa8" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 100 H1080"/>
    <path d="M0 280 H1080"/>
    <path d="M0 460 H1080"/>
    <path d="M0 640 H1080"/>
    <path d="M0 820 H1080"/>
    <path d="M0 1000 H1080"/>
    <path d="M0 1180 H1080"/>
    <path d="M0 1360 H1080"/>
    <path d="M0 1540 H1080"/>
    <path d="M0 1720 H1080"/>
    <path d="M0 1900 H1080"/>
    <path d="M120 0 V1920"/>
    <path d="M300 0 V1920"/>
    <path d="M480 0 V1920"/>
    <path d="M660 0 V1920"/>
    <path d="M840 0 V1920"/>
    <path d="M1020 0 V1920"/>
  </g>

  <circle cx="880" cy="360" r="260" fill="url(#neon)" opacity="0.12" filter="url(#glowSoft)"/>

  <g fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-60 260 L260 260 L340 460 L700 460 L780 640 L1140 640" stroke-width="10" opacity="0.35" filter="url(#glow)"/>
